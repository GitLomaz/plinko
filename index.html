<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plinko Game</title>
    
    <!-- External Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/decimal.js/9.0.0/decimal.min.js"></script>
    
    <!-- Ad System -->
    <script src="JS/cpmstar.js"></script>
    
    <!-- Main Game -->
    <script type="module" src="JS/main.js"></script>
  </head>
  <body style="margin: 0; padding: 0; overflow: hidden;">
    <div id="wrapperContainer">
      <div id="wrapper"></div>
    </div>
    
    <!-- Ad Integration Script -->
    <script>
      var rAd;
      if (typeof cpmstarAPI !== 'undefined') {
        cpmstarAPI(function(api) {  
          api.game.setContentID('7534S7F98E846');                      
          rAd = new api.game.RewardedVideoView("rewardedvideo");
          rAd.load();
          if(rAd) {
            rAd.addEventListener("ad_opened", function(e) {        
              if (window.scene && window.scene.adManager) {
                window.scene.adManager.playingAd = true;
              }        
            });
            rAd.addEventListener("ad_closed", function(e) {              
              setTimeout(function() {
                if (window.scene && window.scene.adManager) {
                  window.scene.adManager.completeAd();
                }  
              }, 700);
              rAd.load();
            });
          }
        });
      }

      function displayRewardedVideo() {      
        if(rAd && rAd.isLoaded()) rAd.show();
        else if(rAd) rAd.load();
      }
    </script>
  </body>
</html>
